name: Patch Build APK - Ensure lib Files (One-Time)

# build-apk.yml: tambahkan step "Ensure lib files" sebelum "Prepare Web Assets"
# agar lib/zxing.min.js (scan resi), lib/leaflet.js & lib/leaflet.css (peta)
# selalu tersedia. Kalau file tidak ada di repo, diunduh otomatis dari CDN.
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Patch build-apk.yml
        run: |
          python3 - <<'PY'
          import sys, os, textwrap
          p = '.github/workflows/build-apk.yml'
          if not os.path.exists(p):
              sys.exit('❌ ' + p + ' tidak ditemukan')
          s = open(p, encoding='utf-8').read()
          if '/*ENSURE-LIB-v1*/' in s:
              print('✅ sudah dipatch'); sys.exit(0)

          anchor = '      - name: Prepare Web Assets\n'
          if s.count(anchor) != 1:
              sys.exit('❌ anchor "Prepare Web Assets" tidak ditemukan tepat 1x — build-apk.yml TIDAK diubah')

          NEWSTEP = textwrap.dedent('''\
                # /*ENSURE-LIB-v1*/ Pastikan lib/ yang dibutuhkan fitur (peta, scan resi) tersedia
                - name: Ensure lib files (leaflet, zxing)
                  run: |
                    mkdir -p lib
                    for pair in \\
                      "leaflet.js|https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js" \\
                      "leaflet.css|https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css" \\
                      "zxing.min.js|https://cdn.jsdelivr.net/npm/@zxing/library@0.20.0/umd/index.min.js"; do
                      f="${pair%%|*}"; url="${pair##*|}"
                      if [ ! -f "lib/$f" ]; then
                        echo "⬇️  Download lib/$f"
                        curl -fsSL -o "lib/$f" "$url" || echo "⚠️  Gagal download $f (fitur terkait akan fallback)"
                      else
                        echo "✅ lib/$f sudah ada"
                      fi
                    done
                    ls -lh lib/

          ''')

          s = s.replace(anchor, NEWSTEP + anchor, 1)
          open(p, 'w', encoding='utf-8').write(s)
          print('✅ build-apk.yml dipatch (ensure lib files)')
          PY

      - name: Commit perubahan
        run: |
          if git diff --quiet .github/workflows/build-apk.yml; then
            echo "✅ Tidak ada perubahan"
          else
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add .github/workflows/build-apk.yml
            git commit -m "chore(apk): ensure lib files (leaflet, zxing) sebelum prepare assets"
            git push
            echo "✅ Di-commit ke repo"
          fi
