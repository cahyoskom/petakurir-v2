name: Patch Index - Indikator Tanpa Lokasi (One-Time)

# index.html: badge "📍 Tanpa Lokasi" pada record tanpa koordinat valid
# (biasanya hasil import CSV OCR), filter chip di list, dan info jumlah
# setelah import sukses. Tidak mengubah alur import.
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Patch index.html
        run: |
          python3 - <<'PY'
          import sys, os
          p = 'index.html'
          if not os.path.exists(p):
              sys.exit('❌ index.html tidak ditemukan di root repo')
          s = open(p, encoding='utf-8').read()
          if '/*NOLOC-v1*/' in s:
              print('✅ sudah dipatch'); sys.exit(0)

          def once(old, new, label):
              global s
              n = s.count(old)
              if n != 1:
                  sys.exit('❌ ' + label + ' ditemukan ' + str(n) + 'x (butuh tepat 1) — index.html TIDAK diubah')
              s = s.replace(old, new, 1)

          # 1) CSS badge — sisipkan sebelum </style> (satu-satunya penutup style)
          once(
              '</style>',
              '/*NOLOC-v1*/\n'
              '.noloc-badge{display:inline-block;background:#fef3c7;color:#92400e;'
              'padding:2px 8px;border-radius:12px;font-size:10px;font-weight:700;'
              'margin-left:4px;vertical-align:middle;white-space:nowrap;flex-shrink:0}\n'
              '@media(prefers-color-scheme:dark){.noloc-badge{background:#78350f;color:#fde68a}}\n'
              '</style>',
              'CSS noloc-badge'
          )

          # 2) Badge di list — sisipkan setelah nama
          once(
              '<div class="address-item-name">${a.recipient_name}</div></div><span style="color:${sc};font-weight:600;font-size:12px">${sl}</span>',
              """<div class="address-item-name">${a.recipient_name}</div>${!hasValidCoordinates(a)?'<span class="noloc-badge">📍 Tanpa Lokasi</span>':''}</div><span style="color:${sc};font-weight:600;font-size:12px">${sl}</span>""",
              'badge list'
          )

          # 3) Filter chip di list
          once(
              '<button class="filter-btn" data-filter="sulit">Sulit</button>',
              '<button class="filter-btn" data-filter="sulit">Sulit</button>\n'
              '<button class="filter-btn" data-filter="nocoord">📍 Tanpa Lokasi</button>',
              'filter chip list'
          )

          # 4) Logika filter list
          once(
              "            if(currentFilter==='sulit')return a.location_type==='sulit'||a.location_type==='patokan';",
              "            if(currentFilter==='sulit')return a.location_type==='sulit'||a.location_type==='patokan';\n"
              "            if(currentFilter==='nocoord')return !hasValidCoordinates(a);",
              'filter logic list'
          )

          # 5) Info jumlah no-coord setelah import sukses
          once(
              '    msg+=`\\n\\n💡 Semua status = "Belum Selesai"`;',
              '    msg+=`\\n\\n💡 Semua status = "Belum Selesai"`;\n'
              '    try{const _noc=(await getAllAddresses()).filter(a=>!hasValidCoordinates(a));'
              'if(_noc.length>0)msg+=`\\n\\n📍 ${_noc.length} alamat belum punya koordinat — buka Edit → ambil GPS agar bisa di-rute.`;}catch(e){}',
              'info nocoord import'
          )

          open(p, 'w', encoding='utf-8').write(s)
          print('✅ index.html dipatch (indikator tanpa lokasi)')
          PY

      - name: Commit perubahan
        run: |
          if git diff --quiet index.html; then
            echo "✅ Tidak ada perubahan"
          else
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add index.html
            git commit -m "feat(index): indikator tanpa lokasi pada record hasil import"
            git push
            echo "✅ Di-commit ke repo"
          fi
