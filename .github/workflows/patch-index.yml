name: Patch index.html (One-Time)

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/patch-index.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run patch script
        env:
          APP_EMOJI: "🛵"
          ICON_BG: "#2563eb"
          APP_NAME: "Kurir-Q"
        run: python3 patch_index.py

      - name: Commit perubahan
        run: |
          if git diff --quiet index.html; then
            echo "✅ Tidak ada perubahan — index.html sudah versi terbaru"
          else
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add index.html
            git commit -m "chore: patch WA normalization & visual"
            git push
            echo "✅ index.html di-commit balik ke repo"
          fi
