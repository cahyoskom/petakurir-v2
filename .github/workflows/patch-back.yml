name: Patch Tombol Back + Tetap di Latar (One-Time)

# Back menutup panel/halaman dulu. Di beranda, Back memindahkan aplikasi ke latar belakang
# sebagai layanan bernotifikasi. Aplikasi ditutup sepenuhnya lewat tombol "Tutup" di notifikasi.
# Jalankan manual dari tab Actions. Aman dijalankan berulang.
# Setelah ini, unggah juga build-apk.yml terbaru (izin + service Android).
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Patch index.html
        run: |
          python3 - <<'PY'
          import sys
          p = 'index.html'
          s = open(p, encoding='utf-8').read()
          if '/*BACK-v5*/' in s:
              print('✅ sudah dipatch (v5)'); sys.exit(0)
          for fn in ('function closeModal(', 'function closePhotoViewer(', 'function closePanoramaSheet(',
                     'function closeRecordSheet(', 'function closeSidebar(', 'function showPage('):
              if fn not in s:
                  sys.exit('❌ ' + fn + ' tidak ditemukan — index.html TIDAK diubah')
          # buang blok lama (v1 riwayat browser / v2) bila ada
          for mk in ('/*BACK-v1*/', '/*BACK-v2*/', '/*BACK-v3*/', '/*BACK-v4*/'):
              a = s.find(mk)
              if a >= 0:
                  b = s.find('})();', a)
                  if b < 0:
                      sys.exit('❌ blok ' + mk + ' tidak lengkap — index.html TIDAK diubah')
                  s = s[:a].rstrip(' \t\n') + '\n' + s[b + len('})();'):].lstrip('\n')
          i = s.rfind('</script>')
          if i < 0:
              sys.exit('❌ penutup script tidak ditemukan — index.html TIDAK diubah')
          BLOCK = r'''
          /*BACK-v5*/
          (function(){
              const C=window.Capacitor,P=C&&C.Plugins;
              const native=!!(C&&typeof C.isNativePlatform==='function'&&C.isNativePlatform());
              const KEY='kq_bg';
              function isOn(id){const e=document.getElementById(id);return !!(e&&e.classList.contains('active'));}
              function handleBack(){
                  if(isOn('modal')){closeModal();return true;}
                  if(isOn('photo-viewer')){closePhotoViewer();return true;}
                  if(isOn('panorama-sheet')){closePanoramaSheet();return true;}
                  if(isOn('record-sheet')){closeRecordSheet();return true;}
                  if(isOn('detail-sheet')){
                      const b=document.getElementById('close-detail-sheet');
                      if(b)b.click();else document.getElementById('detail-sheet').classList.remove('active');
                      return true;
                  }
                  if(isOn('sidebar')){closeSidebar();return true;}
                  const cur=document.querySelector('.page.active');
                  if(cur&&cur.id!=='list-page'){showPage('list-page');return true;}
                  return false;
              }
              // ---------- catatan langkah (diagnosis jika aplikasi tertutup saat menyalakan layanan) ----------
              function mark(step){try{localStorage.setItem(KEY,JSON.stringify({step:step,t:Date.now()}));}catch(e){}}
              function clearMark(){try{localStorage.removeItem(KEY);}catch(e){}}
              function takeLastMark(){
                  try{
                      const raw=localStorage.getItem(KEY);
                      if(!raw)return null;
                      localStorage.removeItem(KEY);
                      return JSON.parse(raw);
                  }catch(e){return null;}
              }
              function reportLast(d){
                  try{
                      const mins=Math.max(0,Math.round((Date.now()-d.t)/60000));
                      const steps={channel:'membuat channel notifikasi',start:'menyalakan layanan latar',started:'layanan latar sudah menyala'};
                      showModal('Aplikasi sempat tertutup','Terakhir kali ('+mins+' menit lalu) aplikasi tertutup saat berpindah ke latar belakang, pada langkah: '+(steps[d.step]||d.step)+'.\n\nKirim pesan ini ke pengembang agar penyebabnya bisa dicari.');
                  }catch(e){}
              }
              // ---------- layanan latar belakang + notifikasi (tombol Tutup mematikan aplikasi) ----------
              let bgOn=false;
              function androidMajor(){const m=/Android\s+(\d+)/i.exec(navigator.userAgent||'');return m?parseInt(m[1],10):0;}
              async function ensureService(){
                  const FS=P&&P.ForegroundService;
                  if(!FS)throw new Error('Plugin ForegroundService tidak ada di APK ini. Pastikan APK dibuat dari build-apk.yml terbaru.');
                  if(androidMajor()>=13){
                      try{const p=await FS.checkPermissions();if(p&&p.display!=='granted')await FS.requestPermissions();}catch(e){}
                  }
                  mark('channel');
                  try{await FS.createNotificationChannel({id:'kq-bg',name:'Kurir-Q latar belakang',description:'Menjaga aplikasi tetap aktif',importance:2});}catch(e){}
                  mark('start');
                  await FS.startForegroundService({
                      id:7401,title:'Kurir-Q',body:'Berjalan di latar belakang. Ketuk untuk membuka.',
                      smallIcon:'ic_stat_kurirq',notificationChannelId:'kq-bg',
                      buttons:[{id:9001,title:'Tutup'}]
                  });
                  mark('started');
                  bgOn=true;
                  await new Promise(r=>setTimeout(r,1200));
                  clearMark();   // lolos tahap rawan: tidak perlu dilaporkan
              }
              async function goBackground(){
                  try{
                      if(!bgOn)await ensureService();
                  }catch(e){
                      clearMark();
                      showModal('Mode latar belakang gagal','⚠️ '+String((e&&e.message)||e)+'\n\nAplikasi tidak dipindah ke latar belakang. Gunakan tombol Home HP seperti biasa.');
                      return;
                  }
                  try{await P.App.minimizeApp();}catch(e){console.warn('minimizeApp gagal:',e);}
              }
              if(native&&P&&P.App&&typeof P.App.addListener==='function'){
                  const last=takeLastMark();   // dibaca sekarang, sebelum event resume sempat mengubahnya
                  if(last)setTimeout(()=>{if(!isOn('modal'))reportLast(last);},2500);
                  P.App.addListener('backButton',()=>{if(handleBack())return;goBackground();});
                  return;
              }
              // ---------- Web: cadangan lewat riwayat browser ----------
              const GUARD={kq:'guard'};
              let armed=false,timer=null,toastEl=null,toastTimer=null;
              function push(){try{history.pushState(GUARD,'');}catch(e){}}
              function toast(msg){
                  try{
                      if(!toastEl){
                          toastEl=document.createElement('div');
                          toastEl.style.cssText='position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:rgba(0,0,0,.82);color:#fff;padding:10px 16px;border-radius:20px;font-size:13px;z-index:99999;pointer-events:none;transition:opacity .2s;opacity:0';
                          document.body.appendChild(toastEl);
                      }
                      toastEl.textContent=msg;toastEl.style.opacity='1';
                      clearTimeout(toastTimer);toastTimer=setTimeout(()=>{toastEl.style.opacity='0';},1800);
                  }catch(e){}
              }
              function rearm(){if(!armed)return;armed=false;if(timer){clearTimeout(timer);timer=null;}push();}
              function onPop(){
                  if(handleBack()){push();return;}
                  if(armed)return;
                  armed=true;toast('Tekan Back sekali lagi untuk keluar');
                  timer=setTimeout(()=>{timer=null;rearm();},2000);
              }
              function init(){
                  try{
                      if(!(history.state&&history.state.kq==='guard')){history.replaceState({kq:'root'},'');push();}
                  }catch(e){return;}
                  window.addEventListener('popstate',onPop);
                  document.addEventListener('click',rearm,true);
                  document.addEventListener('touchstart',rearm,true);
              }
              if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',init);else init();
          })();
          '''
          s = s[:i] + BLOCK + s[i:]
          open(p, 'w', encoding='utf-8').write(s)
          print('✅ index.html dipatch (Back -> layanan latar v5)')
          PY

      - name: Tambah plugin App & Foreground Service ke package.json
        run: |
          python3 - <<'PY'
          import json
          p = 'package.json'
          d = json.load(open(p, encoding='utf-8'))
          dep = d.setdefault('dependencies', {})
          want = {'@capacitor/app': '^6.0.0',
                  '@capawesome-team/capacitor-android-foreground-service': '6.2.0'}
          changed = False
          for k, v in want.items():
              if k not in dep:
                  dep[k] = v; changed = True
          d['dependencies'] = dict(sorted(dep.items()))
          if changed:
              with open(p, 'w', encoding='utf-8') as f:
                  json.dump(d, f, indent=2, ensure_ascii=False); f.write('\n')
              print('✅ package.json diperbarui')
          else:
              print('✅ package.json sudah berisi plugin')
          PY
          # lockfile lama tidak cocok dengan dependensi baru; build akan memakai npm install
          git rm -q --ignore-unmatch package-lock.json

      - name: Commit perubahan
        run: |
          git add -A index.html package.json
          if git diff --cached --quiet; then
            echo "✅ Tidak ada perubahan"
          else
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git commit -m "feat: Back memindahkan ke layanan latar bernotifikasi dengan tombol Tutup (v5)"
            git push
            echo "✅ Di-commit ke repo"
          fi
