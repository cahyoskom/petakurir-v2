name: Build Android APK

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

# Build hanya manual (tab Actions -> Run workflow) supaya tidak menghabiskan kuota.
# Untuk menyalakan build otomatis setiap push ke main, hapus tanda # pada 3 baris di bawah.
on:
  # push:
  #   branches: [main]
  workflow_dispatch:

env:
  APP_NAME: "Kurir-Q"
  APP_EMOJI: "🛵"
  ICON_BG: "#2563eb"
  ICON_TEXT: "KQ"
  ICON_TEXT_COLOR: "#ffffff"

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Java 21
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Install ImageMagick
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq imagemagick curl

      - name: Install dependencies
        run: |
          if [ -f package-lock.json ]; then npm ci; else npm install; fi

      - name: Patch plugin foreground service (stabil + tombol Tutup)
        run: |
          python3 - <<'PY'
          import re, sys, os
          base = 'node_modules/@capawesome-team/capacitor-android-foreground-service/android/src/main/java/io/capawesome/capacitorjs/plugins/foregroundservice/'
          svc = base + 'AndroidForegroundService.java'
          rcv = base + 'NotificationActionBroadcastReceiver.java'
          for f in (svc, rcv):
              if not os.path.exists(f):
                  sys.exit('❌ ' + f + ' tidak ditemukan (plugin belum terpasang? jalankan patch Back)')

          # 1) service: tidak restart otomatis, tahan intent kosong, dan selalu memanggil startForeground
          s = open(svc, encoding='utf-8').read()
          if 'KQ-PATCH' not in s:
              head = 'public int onStartCommand(Intent intent, int flags, int startId) {\n'
              if head not in s:
                  sys.exit('❌ onStartCommand tidak cocok dengan versi plugin yang diharapkan')
              s = s.replace(head, head + '        /*KQ-PATCH*/\n        if (intent == null) {\n            stopSelf();\n            return START_NOT_STICKY;\n        }\n', 1)
              pat = re.compile(r"\} catch \(Exception exception\) \{\s*Logger\.error\(ForegroundServicePlugin\.TAG, exception\.getMessage\(\), exception\);\s*\}\s*return START_STICKY;")
              if not pat.search(s):
                  sys.exit('❌ blok catch/return service tidak cocok dengan versi plugin yang diharapkan')
              new_tail = (
                  "} catch (Exception exception) {\n"
                  "            Logger.error(ForegroundServicePlugin.TAG, exception.getMessage(), exception);\n"
                  "            try {\n"
                  "                Notification.Builder fallback = Build.VERSION.SDK_INT >= Build.VERSION_CODES.O\n"
                  "                    ? new Notification.Builder(getApplicationContext(), \"kq-bg\")\n"
                  "                    : new Notification.Builder(getApplicationContext());\n"
                  "                fallback.setContentTitle(\"Kurir-Q\").setSmallIcon(android.R.drawable.ic_dialog_info);\n"
                  "                startForeground(7401, fallback.build());\n"
                  "            } catch (Exception ignored) {\n"
                  "            }\n"
                  "        }\n"
                  "        return START_NOT_STICKY;")
              s = pat.sub(lambda m: new_tail, s, count=1)
              open(svc, 'w', encoding='utf-8').write(s)
              print('✅ service dipatch')
          else:
              print('✅ service sudah dipatch')

          # 2) tombol notifikasi "Tutup" (id 9001): hentikan service lalu matikan proses, tanpa bergantung pada JS
          r = open(rcv, encoding='utf-8').read()
          if 'KQ-PATCH' not in r:
              old = 'ForegroundServicePlugin.onButtonClicked(buttonId);'
              if r.count(old) != 1:
                  sys.exit('❌ receiver tidak cocok dengan versi plugin yang diharapkan')
              new = ("if (buttonId == 9001) { /*KQ-PATCH*/\n"
                     "                try {\n"
                     "                    context.stopService(new Intent(context, AndroidForegroundService.class));\n"
                     "                } catch (Exception ignored) {\n"
                     "                }\n"
                     "                android.os.Process.killProcess(android.os.Process.myPid());\n"
                     "                return;\n"
                     "            }\n"
                     "            " + old)
              r = r.replace(old, new, 1)
              open(rcv, 'w', encoding='utf-8').write(r)
              print('✅ receiver dipatch')
          else:
              print('✅ receiver sudah dipatch')
          PY

      - name: Prepare Web Assets
        run: |
          mkdir -p www
          cp index.html sw.js www/
          cp -r lib www/
          if [ -f boot.jpg ]; then cp boot.jpg www/; fi
          rm -f www/lib/note www/lib/images/readme

      - name: Generate Icon & Splash PNG
        env:
          APP_EMOJI: ${{ env.APP_EMOJI }}
          ICON_BG: ${{ env.ICON_BG }}
          ICON_TEXT: ${{ env.ICON_TEXT }}
          ICON_TEXT_COLOR: ${{ env.ICON_TEXT_COLOR }}
          APP_NAME: ${{ env.APP_NAME }}
        run: |
          mkdir -p resources

          # Gambar buatan sendiri: taruh di ROOT repo (atau di folder resources/).
          #   Ikon adaptif : icon-foreground.png + icon-background.png (+ icon-only.png)
          #   Ikon biasa   : icon.png
          #   Splash       : splash.png
          for f in icon icon-only icon-foreground icon-background splash; do
            if [ -f "$f.png" ]; then cp "$f.png" "resources/$f.png"; fi
          done

          HAVE_ADAPTIVE=0
          if [ -f resources/icon-foreground.png ] && [ -f resources/icon-background.png ]; then HAVE_ADAPTIVE=1; fi

          NEED_ICON=0; NEED_SPLASH=0
          if [ "$HAVE_ADAPTIVE" = "0" ]; then [ -f resources/icon.png ] || NEED_ICON=1; fi
          [ -f resources/splash.png ] || NEED_SPLASH=1

          if [ "$NEED_ICON" = "1" ] || [ "$NEED_SPLASH" = "1" ]; then
            declare -A EMOJI_HEX=(
              ["🛵"]="1f6f5"  ["📦"]="1f4e6"  ["🚚"]="1f69a"  ["🏍️"]="1f3cd"
              ["📮"]="1f4ee"  ["🎯"]="1f3af"  ["⚡"]="26a1"   ["🚗"]="1f697"
              ["🛺"]="1f6fa"  ["📱"]="1f4f1"  ["📍"]="1f4cd"  ["🛒"]="1f6d2"
              ["🚀"]="1f680"  ["⭐"]="2b50"   ["🔥"]="1f525"
            )
            HEX="${EMOJI_HEX[$APP_EMOJI]}"
            EMOJI_OK=0
            if [ -n "$HEX" ] && curl -fsSL "https://cdn.jsdelivr.net/gh/twitter/twemoji@14.0.2/assets/72x72/${HEX}.png" -o /tmp/emoji.png; then
              EMOJI_OK=1
            fi
          fi

          if [ "$HAVE_ADAPTIVE" = "1" ]; then
            # icon.png tidak dipakai bersama ikon adaptif (menghindari bentrok di generator)
            rm -f resources/icon.png
            if [ ! -f resources/icon-only.png ]; then
              convert resources/icon-background.png resources/icon-foreground.png -gravity center -composite resources/icon-only.png
            fi
            echo "✅ Memakai ikon adaptif buatan sendiri"
          elif [ "$NEED_ICON" = "1" ]; then
            convert -size 1024x1024 xc:"${ICON_BG}" /tmp/base.png
            if [ "$EMOJI_OK" = "1" ]; then
              convert /tmp/emoji.png -resize 600x600 /tmp/emoji-big.png
              convert /tmp/base.png /tmp/emoji-big.png -gravity center -composite \
                -background "${ICON_BG}" -flatten resources/icon.png
            else
              convert /tmp/base.png -gravity center -font DejaVu-Sans-Bold \
                -pointsize 500 -fill "${ICON_TEXT_COLOR}" -annotate +0+0 "${ICON_TEXT}" \
                resources/icon.png
            fi
          else
            echo "✅ Memakai icon buatan sendiri"
          fi

          if [ "$NEED_SPLASH" = "1" ]; then
            convert -size 2732x2732 xc:"${ICON_BG}" /tmp/splash-base.png
            if [ "$EMOJI_OK" = "1" ]; then
              convert /tmp/emoji.png -resize 1200x1200 /tmp/emoji-splash.png
              convert /tmp/splash-base.png /tmp/emoji-splash.png -gravity center -composite \
                -font DejaVu-Sans-Bold -pointsize 180 -fill "${ICON_TEXT_COLOR}" \
                -gravity center -annotate +0+800 "${APP_NAME}" \
                -background "${ICON_BG}" -flatten resources/splash.png
            else
              convert /tmp/splash-base.png -gravity center -font DejaVu-Sans-Bold \
                -pointsize 1000 -fill "${ICON_TEXT_COLOR}" -annotate +0-200 "${ICON_TEXT}" \
                -pointsize 180 -annotate +0+600 "${APP_NAME}" \
                resources/splash.png
            fi
          else
            echo "✅ Memakai splash buatan sendiri"
          fi

          # Ukuran harus persegi: ikon 1024x1024, splash 2732x2732.
          # Gambar yang ukurannya lain dimuat utuh di tengah lalu diberi latar.
          fit() {
            if [ ! -f "$1" ]; then return 0; fi
            W=$(identify -format "%w" "$1"); H=$(identify -format "%h" "$1")
            if [ "$W" != "$2" ] || [ "$H" != "$2" ]; then
              echo "ℹ️ $1 berukuran ${W}x${H}, disesuaikan ke ${2}x${2}"
              convert "$1" -resize "${2}x${2}" -background "$3" -gravity center -extent "${2}x${2}" "$1"
            fi
          }
          fit resources/icon.png 1024 none
          fit resources/icon-only.png 1024 none
          fit resources/icon-foreground.png 1024 none
          fit resources/icon-background.png 1024 "${ICON_BG}"
          fit resources/splash.png 2732 "${ICON_BG}"

          ls -lh resources/

      - name: Add Android Platform
        run: |
          if [ ! -f "android/app/build.gradle" ]; then
            rm -rf android
            npx cap add android
          fi

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Generate Android Assets
        run: |
          npx capacitor-assets generate --android
          ls -lh android/app/src/main/res/mipmap-xxxhdpi/ || true

      - name: Latar peluncuran warna solid
        run: |
          S=android/app/src/main/res/values/styles.xml
          test -f "$S" || { echo "❌ styles.xml tidak ditemukan"; exit 1; }
          cat > android/app/src/main/res/values/kq_colors.xml <<'XML'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <color name="kq_splash_bg">#2563EB</color>
          </resources>
          XML
          if grep -q '@drawable/splash' "$S"; then
            sed -i 's|<item name="android:background">@drawable/splash</item>|<item name="android:background">@color/kq_splash_bg</item>\n        <item name="windowSplashScreenBackground">@color/kq_splash_bg</item>|' "$S"
          fi
          grep -q 'kq_splash_bg' "$S" || { echo "❌ styles.xml tidak berubah (template berbeda dari yang diharapkan)"; exit 1; }
          echo "✅ Latar peluncuran diganti warna solid"

      - name: Patch AndroidManifest
        run: |
          MANIFEST=android/app/src/main/AndroidManifest.xml
          add_perm() {
            grep -q "android.permission.$1" $MANIFEST || \
              sed -i "s|<application|<uses-permission android:name=\"android.permission.$1\" />\n    <application|" $MANIFEST
          }
          add_perm "ACCESS_FINE_LOCATION"
          add_perm "ACCESS_COARSE_LOCATION"
          add_perm "FOREGROUND_SERVICE"
          add_perm "FOREGROUND_SERVICE_DATA_SYNC"
          add_perm "WAKE_LOCK"

          # Service penahan latar belakang (plugin foreground service)
          grep -q "AndroidForegroundService" $MANIFEST || \
            sed -i 's|</application>|    <receiver android:name="io.capawesome.capacitorjs.plugins.foregroundservice.NotificationActionBroadcastReceiver" android:exported="false" />\n    <service android:name="io.capawesome.capacitorjs.plugins.foregroundservice.AndroidForegroundService" android:foregroundServiceType="dataSync" android:exported="false" />\n    </application>|' $MANIFEST

          # Ikon kecil notifikasi (pin lokasi putih)
          mkdir -p android/app/src/main/res/drawable
          cat > android/app/src/main/res/drawable/ic_stat_kurirq.xml <<'XML'
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="24dp" android:height="24dp"
              android:viewportWidth="24" android:viewportHeight="24">
              <path android:fillColor="#FFFFFFFF"
                  android:pathData="M12,2C8.13,2 5,5.13 5,9c0,5.25 7,13 7,13s7,-7.75 7,-13c0,-3.87 -3.13,-7 -7,-7zM12,11.5c-1.38,0 -2.5,-1.12 -2.5,-2.5s1.12,-2.5 2.5,-2.5 2.5,1.12 2.5,2.5 -1.12,2.5 -2.5,2.5z" />
          </vector>
          XML

          echo "✅ Manifest OK"

      - name: Tambah plugin native pembuka WhatsApp
        run: |
          MAIN=$(find android/app/src/main/java -name MainActivity.java | head -1)
          [ -n "$MAIN" ] || { echo "❌ MainActivity.java tidak ditemukan"; exit 1; }
          DIR=$(dirname "$MAIN")
          PKG=$(grep -m1 '^package ' "$MAIN" | sed 's/^package \(.*\);.*/\1/')

          cat > "$DIR/KqLauncherPlugin.java" <<'JAVA'
          package __PKG__;

          import android.content.ActivityNotFoundException;
          import android.content.Intent;
          import android.net.Uri;
          import com.getcapacitor.Plugin;
          import com.getcapacitor.PluginCall;
          import com.getcapacitor.PluginMethod;
          import com.getcapacitor.annotation.CapacitorPlugin;

          @CapacitorPlugin(name = "KqLauncher")
          public class KqLauncherPlugin extends Plugin {

              @PluginMethod
              public void openWhatsApp(PluginCall call) {
                  String phone = call.getString("phone", "");
                  String text = call.getString("text", "");
                  String pkg = call.getString("package", "");
                  String digits = phone == null ? "" : phone.replaceAll("[^0-9]", "");
                  if (digits.length() < 8) {
                      call.reject("Nomor tidak valid");
                      return;
                  }
                  String suffix = (text == null || text.isEmpty()) ? "" : "&text=" + Uri.encode(text);
                  String[] urls = new String[] {
                      "whatsapp://send?phone=" + digits + suffix,
                      "https://wa.me/" + digits + (suffix.isEmpty() ? "" : "?" + suffix.substring(1))
                  };
                  Exception last = null;
                  for (String url : urls) {
                      try {
                          Intent intent = new Intent(Intent.ACTION_VIEW, Uri.parse(url));
                          if (pkg != null && !pkg.isEmpty()) {
                              intent.setPackage(pkg);
                          }
                          intent.addFlags(Intent.FLAG_ACTIVITY_NEW_TASK);
                          getContext().startActivity(intent);
                          call.resolve();
                          return;
                      } catch (ActivityNotFoundException e) {
                          last = e;
                      } catch (Exception e) {
                          last = e;
                      }
                  }
                  call.reject("Aplikasi tidak terpasang atau tidak bisa dibuka" + (last == null ? "" : ": " + last.getMessage()));
              }
          }
          JAVA

          cat > "$MAIN" <<'JAVA'
          package __PKG__;

          import android.os.Bundle;
          import com.getcapacitor.BridgeActivity;

          public class MainActivity extends BridgeActivity {
              @Override
              public void onCreate(Bundle savedInstanceState) {
                  registerPlugin(KqLauncherPlugin.class);
                  super.onCreate(savedInstanceState);
              }
          }
          JAVA

          sed -i "s/__PKG__/$PKG/" "$DIR/KqLauncherPlugin.java" "$MAIN"

          # izinkan melihat/membuka WhatsApp dan WhatsApp Business (Android 11+)
          M=android/app/src/main/AndroidManifest.xml
          grep -q 'com.whatsapp.w4b' $M || \
            sed -i 's|<application|<queries>\n        <package android:name="com.whatsapp" />\n        <package android:name="com.whatsapp.w4b" />\n    </queries>\n    <application|' $M
          echo "✅ Plugin pembuka WhatsApp terpasang ($PKG)"

      - name: Verifikasi manifest, plugin, dan ikon (gagalkan build bila tidak lengkap)
        run: |
          M=android/app/src/main/AndroidManifest.xml
          OK=1
          grep -q 'AndroidForegroundService' $M || { echo "❌ service foreground tidak ada di manifest"; OK=0; }
          grep -q 'android.permission.FOREGROUND_SERVICE"' $M || { echo "❌ izin FOREGROUND_SERVICE tidak ada"; OK=0; }
          grep -q 'android.permission.WAKE_LOCK' $M || { echo "❌ izin WAKE_LOCK tidak ada"; OK=0; }
          test -f android/app/src/main/res/drawable/ic_stat_kurirq.xml || { echo "❌ ikon notifikasi ic_stat_kurirq.xml tidak ada"; OK=0; }
          grep -q 'KQ-PATCH' node_modules/@capawesome-team/capacitor-android-foreground-service/android/src/main/java/io/capawesome/capacitorjs/plugins/foregroundservice/AndroidForegroundService.java || { echo "❌ patch service plugin tidak terpasang"; OK=0; }
          grep -q 'KQ-PATCH' node_modules/@capawesome-team/capacitor-android-foreground-service/android/src/main/java/io/capawesome/capacitorjs/plugins/foregroundservice/NotificationActionBroadcastReceiver.java || { echo "❌ patch tombol Tutup tidak terpasang"; OK=0; }
          grep -q 'kq_splash_bg' android/app/src/main/res/values/styles.xml || { echo "❌ latar peluncuran solid tidak terpasang"; OK=0; }
          if grep -q 'splash-screen' package.json; then
            grep -q 'androidScaleType' android/app/src/main/assets/capacitor.config.json || { echo "❌ konfigurasi SplashScreen tidak ikut ter-sync (jalankan patch Splash)"; OK=0; }
            grep -q 'splashscreen' android/app/src/main/assets/capacitor.plugins.json || { echo "❌ plugin SplashScreen tidak terdaftar"; OK=0; }
          else
            echo "❌ plugin @capacitor/splash-screen belum ada di package.json (jalankan patch Splash)"; OK=0
          fi
          grep -q 'foregroundservice' android/app/src/main/assets/capacitor.plugins.json || { echo "❌ plugin ForegroundService tidak terdaftar (cek package.json / jalankan patch Back)"; OK=0; }
          grep -q 'plugins.app' android/app/src/main/assets/capacitor.plugins.json || { echo "❌ plugin @capacitor/app tidak terdaftar"; OK=0; }
          KL=$(find android/app/src/main/java -name KqLauncherPlugin.java | head -1)
          [ -n "$KL" ] || { echo "❌ KqLauncherPlugin.java tidak ada"; OK=0; }
          grep -rq 'registerPlugin(KqLauncherPlugin.class)' android/app/src/main/java || { echo "❌ MainActivity tidak mendaftarkan KqLauncherPlugin"; OK=0; }
          grep -q 'com.whatsapp.w4b' $M || { echo "❌ <queries> WhatsApp tidak ada di manifest"; OK=0; }
          [ "$OK" = "1" ] || exit 1
          echo "✅ Manifest, plugin, dan ikon lengkap"

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('android/**/*.gradle*') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      - name: Build Debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace

      - name: Cek isi APK (informasi saja)
        continue-on-error: true
        run: |
          APK=android/app/build/outputs/apk/debug/app-debug.apk
          AAPT2=$(ls -d "$ANDROID_HOME"/build-tools/*/aapt2 2>/dev/null | sort -V | tail -1)
          if [ -z "$AAPT2" ]; then echo "aapt2 tidak ditemukan, dilewati"; exit 0; fi
          echo "--- izin di APK ---"
          "$AAPT2" dump permissions "$APK" | grep -E "FOREGROUND|WAKE_LOCK|LOCATION" || true
          echo "--- service di APK ---"
          "$AAPT2" dump xmltree --file AndroidManifest.xml "$APK" | grep -E "AndroidForegroundService|foregroundServiceType" || echo "TIDAK ADA"
          echo "--- ikon notifikasi di APK ---"
          "$AAPT2" dump resources "$APK" | grep -c "ic_stat_kurirq" || true

      - name: Prepare APK
        run: |
          mkdir -p output
          COMMIT=$(echo ${{ github.sha }} | cut -c1-7)
          cp android/app/build/outputs/apk/debug/app-debug.apk \
             output/kurir-q-debug-${{ github.run_number }}-${COMMIT}.apk
          ls -lh output/

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: kurir-q-debug-${{ github.run_number }}
          path: output/*.apk
          retention-days: 30
