name: Build Android APK

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Java 21
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Install dependencies
        run: |
          npm install
          # Pastikan CLI, platform Android, dan plugin terpasang
          npm install @capacitor/cli@6
          npm install @capacitor/android@6
          npm install @capacitor/geolocation@6
          npm install @capacitor/app@6
          npm install @capawesome-team/capacitor-android-foreground-service@6.2.0

      - name: Prepare Web Assets
        run: |
          mkdir -p www
          cp index.html www/
          cp ocr.html www/
          cp -r lib www/

      # ⬇️ INI STEP PENTING: Buat folder android jika belum ada
      - name: Add Android Platform (jika belum ada)
        run: |
          if [ ! -f "android/app/build.gradle" ]; then
            echo "=========================================="
            echo "Folder android/ belum ada, membuat baru..."
            echo "=========================================="
            rm -rf android
            npx cap add android
          else
            echo "Folder android/ sudah ada, skip."
          fi

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Modify AndroidManifest for Background Service
        run: |
          MANIFEST=android/app/src/main/AndroidManifest.xml
          sed -i '/<application/i \
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE" />\n\
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE_DATA_SYNC" />\n\
              <uses-permission android:name="android.permission.WAKE_LOCK" />\n\
              <uses-permission android:name="android.permission.REQUEST_IGNORE_BATTERY_OPTIMIZATIONS" />' $MANIFEST
          
          sed -i '/<\/application>/i \
              <service android:name="com.capawesome.capacitorjs.plugins.foregroundservice.ForegroundService" android:foregroundServiceType="dataSync" android:exported="false" />' $MANIFEST

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('android/**/*.gradle*') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      - name: Decode keystore
        run: echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > android/app/release.jks

      - name: Build Release APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --stacktrace \
            -Pandroid.injected.signing.store.file=$(pwd)/app/release.jks \
            -Pandroid.injected.signing.store.password=${{ secrets.KEYSTORE_PASSWORD }} \
            -Pandroid.injected.signing.key.alias=${{ secrets.KEY_ALIAS }} \
            -Pandroid.injected.signing.key.password=${{ secrets.KEY_PASSWORD }}

      - name: Prepare APK
        run: |
          mkdir -p output
          COMMIT=$(echo ${{ github.sha }} | cut -c1-7)
          cp android/app/build/outputs/apk/release/app-release.apk \
             output/kurir-q-build-${{ github.run_number }}-${COMMIT}.apk

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: kurir-q-build-${{ github.run_number }}
          path: output/*.apk

      - name: Create Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: output/*.apk
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
