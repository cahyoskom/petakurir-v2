<html>
<style>
   div{min-height:1em;}
</style>
<body>name: Build Android APK<br/><br/>concurrency:<br/>  group: build-${{ github.ref }}<br/>  cancel-in-progress: true<br/><br/># Build hanya manual (tab Actions -&gt; Run workflow) supaya tidak menghabiskan kuota.<br/># Untuk menyalakan build otomatis setiap push ke main, hapus tanda # pada 3 baris di bawah.<br/>on:<br/>  # push:<br/>  #   branches: [main]<br/>  workflow_dispatch:<br/><br/>env:<br/>  APP_NAME: &quot;Kurir-Q&quot;<br/>  APP_EMOJI: &quot;🛵&quot;<br/>  ICON_BG: &quot;#2563eb&quot;<br/>  ICON_TEXT: &quot;KQ&quot;<br/>  ICON_TEXT_COLOR: &quot;#ffffff&quot;<br/><br/>jobs:<br/>  build:<br/>    runs-on: ubuntu-latest<br/><br/>    steps:<br/>      - name: Checkout<br/>        uses: actions/checkout@v4<br/><br/>      - name: Setup Node.js<br/>        uses: actions/setup-node@v4<br/>        with:<br/>          node-version: 20<br/><br/>      - name: Setup Java 21<br/>        uses: actions/setup-java@v5<br/>        with:<br/>          distribution: &#39;temurin&#39;<br/>          java-version: &#39;21&#39;<br/><br/>      - name: Install ImageMagick<br/>        run: |<br/>          sudo apt-get update -qq<br/>          sudo apt-get install -y -qq imagemagick curl<br/><br/>      - name: Install dependencies<br/>        run: |<br/>          if [ -f package-lock.json ]; then npm ci; else npm install; fi<br/><br/>      - name: Prepare Web Assets<br/>        run: |<br/>          mkdir -p www<br/>          cp index.html sw.js www/<br/>          cp -r lib www/<br/>          rm -f www/lib/note www/lib/images/readme<br/><br/>      - name: Generate Icon &amp; Splash PNG<br/>        env:<br/>          APP_EMOJI: ${{ env.APP_EMOJI }}<br/>          ICON_BG: ${{ env.ICON_BG }}<br/>          ICON_TEXT: ${{ env.ICON_TEXT }}<br/>          ICON_TEXT_COLOR: ${{ env.ICON_TEXT_COLOR }}<br/>          APP_NAME: ${{ env.APP_NAME }}<br/>        run: |<br/>          mkdir -p resources<br/><br/>          # Gambar buatan sendiri: taruh icon.png dan/atau splash.png di ROOT repo<br/>          # (atau di folder resources/). Yang tidak ada akan dibuat otomatis.<br/>          if [ -f icon.png ]; then cp icon.png resources/icon.png; fi<br/>          if [ -f splash.png ]; then cp splash.png resources/splash.png; fi<br/><br/>          NEED_ICON=0; NEED_SPLASH=0<br/>          [ -f resources/icon.png ] || NEED_ICON=1<br/>          [ -f resources/splash.png ] || NEED_SPLASH=1<br/><br/>          if [ &quot;$NEED_ICON&quot; = &quot;1&quot; ] || [ &quot;$NEED_SPLASH&quot; = &quot;1&quot; ]; then<br/>            declare -A EMOJI_HEX=(<br/>              [&quot;🛵&quot;]=&quot;1f6f5&quot;  [&quot;📦&quot;]=&quot;1f4e6&quot;  [&quot;🚚&quot;]=&quot;1f69a&quot;  [&quot;🏍️&quot;]=&quot;1f3cd&quot;<br/>              [&quot;📮&quot;]=&quot;1f4ee&quot;  [&quot;🎯&quot;]=&quot;1f3af&quot;  [&quot;⚡&quot;]=&quot;26a1&quot;   [&quot;🚗&quot;]=&quot;1f697&quot;<br/>              [&quot;🛺&quot;]=&quot;1f6fa&quot;  [&quot;📱&quot;]=&quot;1f4f1&quot;  [&quot;📍&quot;]=&quot;1f4cd&quot;  [&quot;🛒&quot;]=&quot;1f6d2&quot;<br/>              [&quot;🚀&quot;]=&quot;1f680&quot;  [&quot;⭐&quot;]=&quot;2b50&quot;   [&quot;🔥&quot;]=&quot;1f525&quot;<br/>            )<br/>            HEX=&quot;${EMOJI_HEX[$APP_EMOJI]}&quot;<br/>            EMOJI_OK=0<br/>            if [ -n &quot;$HEX&quot; ] &amp;&amp; curl -fsSL &quot;https://cdn.jsdelivr.net/gh/twitter/twemoji@14.0.2/assets/72x72/${HEX}.png&quot; -o /tmp/emoji.png; then<br/>              EMOJI_OK=1<br/>            fi<br/>          fi<br/><br/>          if [ &quot;$NEED_ICON&quot; = &quot;1&quot; ]; then<br/>            convert -size 1024x1024 xc:&quot;${ICON_BG}&quot; /tmp/base.png<br/>            if [ &quot;$EMOJI_OK&quot; = &quot;1&quot; ]; then<br/>              convert /tmp/emoji.png -resize 600x600 /tmp/emoji-big.png<br/>              convert /tmp/base.png /tmp/emoji-big.png -gravity center -composite \<br/>                -background &quot;${ICON_BG}&quot; -flatten resources/icon.png<br/>            else<br/>              convert /tmp/base.png -gravity center -font DejaVu-Sans-Bold \<br/>                -pointsize 500 -fill &quot;${ICON_TEXT_COLOR}&quot; -annotate +0+0 &quot;${ICON_TEXT}&quot; \<br/>                resources/icon.png<br/>            fi<br/>          else<br/>            echo &quot;✅ Memakai icon buatan sendiri&quot;<br/>          fi<br/><br/>          if [ &quot;$NEED_SPLASH&quot; = &quot;1&quot; ]; then<br/>            convert -size 2732x2732 xc:&quot;${ICON_BG}&quot; /tmp/splash-base.png<br/>            if [ &quot;$EMOJI_OK&quot; = &quot;1&quot; ]; then<br/>              convert /tmp/emoji.png -resize 1200x1200 /tmp/emoji-splash.png<br/>              convert /tmp/splash-base.png /tmp/emoji-splash.png -gravity center -composite \<br/>                -font DejaVu-Sans-Bold -pointsize 180 -fill &quot;${ICON_TEXT_COLOR}&quot; \<br/>                -gravity center -annotate +0+800 &quot;${APP_NAME}&quot; \<br/>                -background &quot;${ICON_BG}&quot; -flatten resources/splash.png<br/>            else<br/>              convert /tmp/splash-base.png -gravity center -font DejaVu-Sans-Bold \<br/>                -pointsize 1000 -fill &quot;${ICON_TEXT_COLOR}&quot; -annotate +0-200 &quot;${ICON_TEXT}&quot; \<br/>                -pointsize 180 -annotate +0+600 &quot;${APP_NAME}&quot; \<br/>                resources/splash.png<br/>            fi<br/>          else<br/>            echo &quot;✅ Memakai splash buatan sendiri&quot;<br/>          fi<br/><br/>          # Ukuran harus persegi: icon 1024x1024, splash 2732x2732.<br/>          # Gambar yang ukurannya lain dimuat utuh di tengah lalu diberi latar.<br/>          fit() {<br/>            W=$(identify -format &quot;%w&quot; &quot;$1&quot;); H=$(identify -format &quot;%h&quot; &quot;$1&quot;)<br/>            if [ &quot;$W&quot; != &quot;$2&quot; ] || [ &quot;$H&quot; != &quot;$2&quot; ]; then<br/>              echo &quot;ℹ️ $1 berukuran ${W}x${H}, disesuaikan ke ${2}x${2}&quot;<br/>              convert &quot;$1&quot; -resize &quot;${2}x${2}&quot; -background &quot;$3&quot; -gravity center -extent &quot;${2}x${2}&quot; &quot;$1&quot;<br/>            fi<br/>          }<br/>          fit resources/icon.png 1024 none<br/>          fit resources/splash.png 2732 &quot;${ICON_BG}&quot;<br/><br/>          ls -lh resources/icon.png resources/splash.png<br/><br/>      - name: Add Android Platform<br/>        run: |<br/>          if [ ! -f &quot;android/app/build.gradle&quot; ]; then<br/>            rm -rf android<br/>            npx cap add android<br/>          fi<br/><br/>      - name: Sync Capacitor<br/>        run: npx cap sync android<br/><br/>      - name: Generate Android Assets<br/>        run: |<br/>          npx capacitor-assets generate --android<br/>          ls -lh android/app/src/main/res/mipmap-xxxhdpi/ || true<br/><br/>      - name: Patch AndroidManifest<br/>        run: |<br/>          MANIFEST=android/app/src/main/AndroidManifest.xml<br/>          add_perm() {<br/>            grep -q &quot;android.permission.$1&quot; $MANIFEST || \<br/>              sed -i &quot;s|&lt;application|&lt;uses-permission android:name=\&quot;android.permission.$1\&quot; /&gt;\n    &lt;application|&quot; $MANIFEST<br/>          }<br/>          add_perm &quot;ACCESS_FINE_LOCATION&quot;<br/>          add_perm &quot;ACCESS_COARSE_LOCATION&quot;<br/>          echo &quot;✅ Manifest OK&quot;<br/><br/>      - name: Cache Gradle<br/>        uses: actions/cache@v4<br/>        with:<br/>          path: |<br/>            ~/.gradle/caches<br/>            ~/.gradle/wrapper<br/>          key: gradle-${{ runner.os }}-${{ hashFiles(&#39;android/**/*.gradle*&#39;) }}<br/>          restore-keys: |<br/>            gradle-${{ runner.os }}-<br/><br/>      - name: Build Debug APK<br/>        working-directory: android<br/>        run: |<br/>          chmod +x gradlew<br/>          ./gradlew assembleDebug --stacktrace<br/><br/>      - name: Prepare APK<br/>        run: |<br/>          mkdir -p output<br/>          COMMIT=$(echo ${{ github.sha }} | cut -c1-7)<br/>          cp android/app/build/outputs/apk/debug/app-debug.apk \<br/>             output/kurir-q-debug-${{ github.run_number }}-${COMMIT}.apk<br/>          ls -lh output/<br/><br/>      - name: Upload Artifact<br/>        uses: actions/upload-artifact@v4<br/>        with:<br/>          name: kurir-q-debug-${{ github.run_number }}<br/>          path: output/*.apk<br/>          retention-days: 30<br/></body>
</html>