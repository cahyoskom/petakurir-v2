name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '22'

    - name: Setup Java JDK 17
      uses: actions/setup-java@v5
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Prepare www folder
      run: |
        mkdir -p www
        cp index.html www/
        if [ -d "lib" ]; then cp -r lib www/; fi
        echo "=== Isi www/ ==="
        ls -la www/

    - name: Install dependencies
      run: npm install

    - name: Add Android platform
      run: npx cap add android

    - name: Sync web assets
      run: npx cap sync

    - name: Verify Geolocation plugin installed
      run: |
        echo "=== @capacitor/geolocation di node_modules ==="
        if [ -d "node_modules/@capacitor/geolocation" ]; then
          echo "✅ Folder plugin ADA"
          ls node_modules/@capacitor/geolocation/
        else
          echo "❌ Folder plugin TIDAK ADA"
        fi
        echo ""
        echo "=== capacitor.plugins.json ==="
        cat android/app/src/main/assets/capacitor.plugins.json 2>/dev/null || echo "❌ FILE TIDAK ADA"
        echo ""
        echo "=== capacitor.settings.gradle ==="
        cat android/capacitor.settings.gradle 2>/dev/null || echo "❌ FILE TIDAK ADA"
        echo ""
        echo "=== capacitor.build.gradle (app) ==="
        cat android/app/capacitor.build.gradle 2>/dev/null || echo "❌ FILE TIDAK ADA"

    - name: Inject location permissions to AndroidManifest
      run: |
        MANIFEST="android/app/src/main/AndroidManifest.xml"
        echo "=== Manifest SEBELUM inject ==="
        cat $MANIFEST
        if ! grep -q "ACCESS_FINE_LOCATION" $MANIFEST; then
          echo ""
          echo "Injecting location permissions..."
          sed -i 's|<application|<uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION" />\n    <uses-permission android:name="android.permission.ACCESS_FINE_LOCATION" />\n    <application|' $MANIFEST
        fi
        echo ""
        echo "=== Manifest SESUDAH inject ==="
        cat $MANIFEST
        echo ""
        grep -q "ACCESS_FINE_LOCATION" $MANIFEST && echo "✅ FINE_LOCATION OK" || (echo "❌ FINE_LOCATION MISSING" && exit 1)
        grep -q "ACCESS_COARSE_LOCATION" $MANIFEST && echo "✅ COARSE_LOCATION OK" || (echo "❌ COARSE_LOCATION MISSING" && exit 1)

    - name: Build Debug APK
      working-directory: android
      run: |
        chmod +x gradlew
        ./gradlew assembleDebug

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: kurir-q-debug-apk
        path: android/app/build/outputs/apk/debug/app-debug.apk
        retention-days: 30
