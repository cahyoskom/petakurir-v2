name: Build Android APK

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Java 21
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Install dependencies
        run: |
          npm install
          npm install @capacitor/cli@6
          npm install @capacitor/android@6
          npm install @capacitor/geolocation@6
          npm install @capacitor/app@6
          npm install @capawesome-team/capacitor-android-foreground-service@6.2.0

      - name: Prepare Web Assets
        run: |
          mkdir -p www
          cp index.html www/
          cp ocr.html www/
          cp -r lib www/

      - name: Add Android Platform
        run: |
          if [ ! -f "android/app/build.gradle" ]; then
            rm -rf android
            npx cap add android
          fi

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Modify AndroidManifest
        run: |
          MANIFEST=android/app/src/main/AndroidManifest.xml
          sed -i '/<application/i \
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE" />\n\
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE_DATA_SYNC" />\n\
              <uses-permission android:name="android.permission.WAKE_LOCK" />\n\
              <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />\n\
              <uses-permission android:name="android.permission.REQUEST_IGNORE_BATTERY_OPTIMIZATIONS" />' $MANIFEST
          sed -i '/<\/application>/i \
              <service android:name="com.capawesome.capacitorjs.plugins.foregroundservice.ForegroundService" android:foregroundServiceType="dataSync" android:exported="false" />' $MANIFEST

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('android/**/*.gradle*') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      # ⬇️ INI KUNCINYA: build DEBUG, bukan release
      - name: Build Debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace

      - name: Prepare APK
        run: |
          mkdir -p output
          COMMIT=$(echo ${{ github.sha }} | cut -c1-7)
          cp android/app/build/outputs/apk/debug/app-debug.apk \
             output/kurir-q-debug-${{ github.run_number }}-${COMMIT}.apk

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: kurir-q-debug-${{ github.run_number }}
          path: output/*.apk
