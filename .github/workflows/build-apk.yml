name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '22'

    - name: Setup Java JDK 17
      uses: actions/setup-java@v5
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Prepare www folder
      run: |
        mkdir -p www
        cp index.html www/
        if [ -d "lib" ]; then cp -r lib www/; fi
        echo "=== Isi www/ ==="
        ls -la www/

    - name: Install dependencies
      run: npm install

    - name: Add Android platform
      run: npx cap add android

    - name: Sync web assets
      run: npx cap sync

    - name: Verify location permissions
      run: |
        MANIFEST="android/app/src/main/AndroidManifest.xml"
        echo "=== AndroidManifest.xml ==="
        cat $MANIFEST
        grep -q "ACCESS_FINE_LOCATION" $MANIFEST && echo "✅ FINE_LOCATION OK" || echo "⚠️ FINE_LOCATION MISSING"

    - name: Build Debug APK
      working-directory: android
      run: |
        chmod +x gradlew
        ./gradlew assembleDebug

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: kurir-q-debug-apk
        path: android/app/build/outputs/apk/debug/app-debug.apk
        retention-days: 30
