name: Patch Scan QR dari Foto (One-Time)

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Patch index.html (QR file scan)
        run: |
          python3 - <<'PY'
          import sys, os
          p = 'index.html'
          if not os.path.exists(p):
              sys.exit('❌ index.html tidak ada')
          s = open(p, encoding='utf-8').read()

          # Guard
          if '/*QRFILE-v1*/' in s:
              print('✅ sudah dipatch'); sys.exit(0)

          # ── 1) Ubah kqScanLoadLib agar punya CDN fallback + jsQR ──
          old_lib = '''function kqScanLoadLib(){
    if(window.ZXing)return Promise.resolve(true);
    return new Promise(res=>{
        const s=document.createElement('script');
        s.src='lib/zxing.min.js';
        s.onload=()=>res(!!window.ZXing);
        s.onerror=()=>res(false);
        document.head.appendChild(s);
    });
}'''
          new_lib = '''/*QRFILE-v1*/
function kqScanLoadLib(){
    if(window.ZXing)return Promise.resolve(true);
    // Coba lokal dulu, fallback ke CDN
    return new Promise(res=>{
        const s=document.createElement('script');
        s.src='lib/zxing.min.js';
        s.onload=()=>res(!!window.ZXing);
        s.onerror=()=>{
            console.warn('zxing lokal gagal, coba CDN...');
            const s2=document.createElement('script');
            s2.src='https://cdn.jsdelivr.net/npm/@zxing/library@0.20.0/umd/index.min.js';
            s2.onload=()=>res(!!window.ZXing);
            s2.onerror=()=>res(false);
            document.head.appendChild(s2);
        };
        document.head.appendChild(s);
    });
}
function kqScanLoadJsQR(){
    if(window.jsQR)return Promise.resolve(true);
    return new Promise(res=>{
        const s=document.createElement('script');
        s.src='https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.min.js';
        s.onload=()=>res(!!window.jsQR);
        s.onerror=()=>res(false);
        document.head.appendChild(s);
    });
}
async function kqScanDecodeImageFile(file){
    // Strategi berlapis: resize berbeda + binarizer berbeda + jsQR fallback
    const url=URL.createObjectURL(file);
    const img=new Image();
    try{
        await new Promise((ok,no)=>{img.onload=ok;img.onerror=()=>no(new Error('gambar tidak bisa dibuka (format tidak didukung?)'));img.src=url;});
    }catch(e){
        URL.revokeObjectURL(url);
        throw e;
    }
    const hasZX=await kqScanLoadLib();
    const hasJS=await kqScanLoadJsQR();
    if(!hasZX&&!hasJS){
        URL.revokeObjectURL(url);
        throw new Error('tidak ada decoder (zxing & jsQR gagal dimuat)');
    }
    // Kumpulkan semua scale yang mau dicoba
    const maxSide=Math.max(img.width,img.height);
    const scales=[];
    for(const max of [2000,1600,1200,900,640]){
        if(max<maxSide)scales.push(max);
    }
    scales.push(maxSide); // native size
    scales.push(maxSide*2); // upscale 2x
    let text='';
    for(const max of scales){
        const sc=max/Math.max(img.width,img.height);
        const w=Math.max(1,Math.round(img.width*sc));
        const h=Math.max(1,Math.round(img.height*sc));
        const c=document.createElement('canvas');c.width=w;c.height=h;
        const ctx=c.getContext('2d',{willReadFrequently:true});
        ctx.fillStyle='#fff';ctx.fillRect(0,0,w,h);
        ctx.drawImage(img,0,0,w,h);

        // 1) ZXing dengan 2 binarizer berbeda
        if(hasZX){
            text=kqScanDecodeCanvas(c);if(text)break;
            // coba GlobalHistogram (kadang lebih baik untuk foto gelap)
            try{
                const bmp=new ZXing.BinaryBitmap(new ZXing.GlobalHistogramBinarizer(new ZXing.HTMLCanvasElementLuminanceSource(c)));
                text=kqScanReaderGet().decode(bmp).getText();if(text)break;
            }catch(e){}
        }
        // 2) jsQR fallback
        if(hasJS){
            try{
                const id=ctx.getImageData(0,0,w,h);
                const code=jsQR(id.data,w,h,{inversionAttempts:'attemptBoth'});
                if(code&&code.data){text=code.data;break;}
            }catch(e){}
            // 2b) jsQR grayscale (kadang lebih peka)
            try{
                const id=ctx.getImageData(0,0,w,h);
                const gd=id.data;for(let i=0;i<gd.length;i+=4){const v=(gd[i]*0.299+gd[i+1]*0.587+gd[i+2]*0.114)|0;gd[i]=gd[i+1]=gd[i+2]=v;}
                const code=jsQR(gd,w,h,{inversionAttempts:'attemptBoth'});
                if(code&&code.data){text=code.data;break;}
            }catch(e){}
        }
        c.width=0;c.height=0;
    }
    URL.revokeObjectURL(url);
    return text;
}'''
          if old_lib not in s:
              sys.exit('❌ kqScanLoadLib tidak ditemukan (format berbeda?)')
          s = s.replace(old_lib, new_lib, 1)
          print('✅ kqScanLoadLib diganti (CDN fallback + jsQR)')

          # ── 2) Ganti handler scan-file ──
          old_handler = '''(function(){
    const f=document.getElementById('scan-file');
    if(!f)return;
    f.addEventListener('change',async()=>{
        const file=f.files&&f.files[0];if(!file)return;
        kqScanMsg('Membaca gambar...');
        try{
  if(!(await kqScanLoadLib()))throw new Error('pustaka pemindai tidak ditemukan');
  const url=URL.createObjectURL(file);
  const img=new Image();
  await new Promise((ok,no)=>{img.onload=ok;img.onerror=()=>no(new Error('gambar tidak bisa dibuka'));img.src=url;});
  let text='';
  for(const max of [1600,1000,640]){
      const sc=Math.min(1,max/Math.max(img.width,img.height));
      const c=document.createElement('canvas');c.width=Math.round(img.width*sc);c.height=Math.round(img.height*sc);
      c.getContext('2d').drawImage(img,0,0,c.width,c.height);
      text=kqScanDecodeCanvas(c);if(text)break;
  }
  URL.revokeObjectURL(url);
  if(text)kqScanHandle(text);else kqScanMsg('Tidak ada QR/barcode terbaca di foto. Coba foto lebih dekat dan tajam.');
        }catch(e){kqScanMsg('Gagal membaca foto: '+(e&&e.message?e.message:e));}
    });
})();'''
          new_handler = '''(function(){
    const f=document.getElementById('scan-file');
    if(!f)return;
    f.addEventListener('change',async()=>{
        const file=f.files&&f.files[0];if(!file)return;
        kqScanMsg('Membaca gambar...');
        try{
            const text=await kqScanDecodeImageFile(file);
            if(text)kqScanHandle(text);
            else kqScanMsg('Tidak ada QR/barcode terbaca. Coba: (1) foto lebih dekat & tajam, (2) QR tidak miring, (3) pencahayaan cukup.');
        }catch(e){kqScanMsg('Gagal membaca foto: '+(e&&e.message?e.message:e));}
    });
})();'''
          if old_handler not in s:
              sys.exit('❌ handler scan-file tidak ditemukan')
          s = s.replace(old_handler, new_handler, 1)
          print('✅ handler scan-file diganti (multi-strategy)')

          open(p, 'w', encoding='utf-8').write(s)
          print('\n✅ Patch selesai. Build APK ulang untuk memakainya.')
          PY

      - name: Commit
        run: |
          if git diff --quiet index.html; then
            echo "✅ Tidak ada perubahan"
          else
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add index.html
            git commit -m "fix: scan QR dari foto (CDN fallback + jsQR + multi-scale)"
            git push
            echo "✅ Di-commit"
          fi
