name: Patch Scan QR dari Foto (One-Time)

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Patch index.html
        run: |
          python3 -c '
          import sys
          s = open("index.html").read()
          if "QRFILE-v1" in s:
              print("already patched")
              sys.exit(0)
          old = "function kqScanLoadLib(){"
          if old not in s:
              print("ERROR: kqScanLoadLib not found")
              sys.exit(1)
          loader = "function kqScanLoadJsQR(){if(window.jsQR)return Promise.resolve(true);return new Promise(function(r){var t=document.createElement(\"script\");t.src=\"lib/jsqr.min.js\";t.onload=function(){r(!!window.jsQR)};t.onerror=function(){var u=document.createElement(\"script\");u.src=\"https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.min.js\";u.onload=function(){r(!!window.jsQR)};u.onerror=function(){r(false)};document.head.appendChild(u)};document.head.appendChild(t)})}"
          s = s.replace(old, "/*QRFILE-v1*/" + loader + old, 1)
          z1 = "s.onerror=()=>res(false);"
          z2 = "s.onerror=()=>{var t=document.createElement(\"script\");t.src=\"https://cdn.jsdelivr.net/npm/@zxing/library@0.20.0/umd/index.min.js\";t.onload=()=>res(!!window.ZXing);t.onerror=()=>res(false);document.head.appendChild(t)};"
          s = s.replace(z1, z2, 1)
          s = s.replace("for(const max of [1600,1000,640]){", "for(const max of [2000,1600,1200,900,640]){", 1)
          d1 = "text=kqScanDecodeCanvas(c);if(text)break;"
          d2 = "text=kqScanDecodeCanvas(c);if(text)break;try{var i=c.getContext(\"2d\").getImageData(0,0,c.width,c.height);if(window.jsQR){var j=jsQR(i.data,c.width,c.height,{inversionAttempts:\"attemptBoth\"});if(j&&j.data){text=j.data;break}}}catch(e){}"
          s = s.replace(d1, d2, 1)
          open("index.html", "w").write(s)
          print("OK patched")
          '

      - name: Commit
        run: |
          if git diff --quiet index.html; then
            echo "no changes"
          else
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add index.html
            git commit -m "fix: scan QR from photo (jsQR + ZXing CDN fallback)"
            git push
            echo "committed"
          fi
