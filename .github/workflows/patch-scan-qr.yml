name: Patch Scan QR dari Foto (One-Time)

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Patch index.html
        run: |
          python3 << 'PYEOF'
          import sys
          s = open('index.html').read()
          if '/*QRFILE-v1*/' in s:
              print('sudah dipatch'); sys.exit(0)
          new_loader = "function kqScanLoadJsQR(){if(window.jsQR)return Promise.resolve(true);return new Promise(res=>{const s=document.createElement('script');s.src='lib/jsqr.min.js';s.onload=()=>res(!!window.jsQR);s.onerror=()=>{const s2=document.createElement('script');s2.src='https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.min.js';s2.onload=()=>res(!!window.jsQR);s2.onerror=()=>res(false);document.head.appendChild(s2);};document.head.appendChild(s);});}"
          old_lib = 'function kqScanLoadLib(){'
          if old_lib not in s:
              print('ERROR: kqScanLoadLib tidak ditemukan'); sys.exit(1)
          s = s.replace(old_lib, new_loader + '/*QRFILE-v1*/' + old_lib, 1)
          old_zx = "s.onerror=()=>res(false);"
          new_zx = "s.onerror=()=>{const s2=document.createElement('script');s2.src='https://cdn.jsdelivr.net/npm/@zxing/library@0.20.0/umd/index.min.js';s2.onload=()=>res(!!window.ZXing);s2.onerror=()=>res(false);document.head.appendChild(s2);};"
          s = s.replace(old_zx, new_zx, 1)
          s = s.replace('for(const max of [1600,1000,640]){', 'for(const max of [2000,1600,1200,900,640]){', 1)
          old_dec = 'text=kqScanDecodeCanvas(c);if(text)break;'
          new_dec = "text=kqScanDecodeCanvas(c);if(text)break;try{const _id=c.getContext('2d').getImageData(0,0,c.width,c.height);if(window.jsQR){const _c=jsQR(_id.data,c.width,c.height,{inversionAttempts:'attemptBoth'});if(_c&&_c.data){text=_c.data;break;}}}catch(e){}"
          s = s.replace(old_dec, new_dec, 1)
          open('index.html','w').write(s)
          print('✅ patch applied')
          PYEOF

      - name: Commit
        run: |
          if git diff --quiet index.html; then
            echo "✅ Tidak ada perubahan"
          else
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add index.html
            git commit -m "fix: scan QR dari foto (jsQR fallback + CDN + multi-scale)"
            git push
            echo "✅ Di-commit"
          fi
